      - name: Run tests on the bundled sample fixture
        run: |
          pip install pytest --quiet
          python -m pytest tests/ -q

      - name: Commit code
        run: |
          git config user.name "restkollen-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit (already bootstrapped)."
          else
            git commit -m "bootstrap: Restkollen v1 (pipeline + site)"
            git push
          fi

      - name: Done
        run: echo "Bootstrap complete. Now open the Actions tab, choose 'Nightly data update', and click 'Run workflow' to fetch the first real data."
