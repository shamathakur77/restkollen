name: Bootstrap Restkollen (one-time)

# One-shot bootstrap: unpacks the Restkollen code + site into this
# repository. Runs automatically when this file is committed.
# After it finishes: Actions tab -> "Nightly data update" -> Run workflow.

on:
  workflow_dispatch: {}
  push:
    paths: [".github/workflows/bootstrap.yml"]

permissions:
  contents: write

concurrency:
  group: bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 10
