      - name: Tests must pass before committing
        run: |
          pip install pytest --quiet
          python -m pytest tests/ -q
      - name: Commit and self-remove
        run: |
          git config user.name "restkollen-bot"
          git config user.email "actions@users.noreply.github.com"
          git rm -q .github/workflows/redesign.yml
          git rm -q --ignore-unmatch .github/workflows/bootstrap.yml
          git add -A
          git commit -m "redesign: Nordic editorial UI, human copy pass SV+EN, robots+sitemap"
          git push
